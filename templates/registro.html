<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasty Trail - Registrar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header-left">
      <div class="logo">T T</div>
      <nav class="nav">
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">Produtos</a></li>
          <li><a href="#">Contactos</a></li>
          <li><a href="#">Sobre</a></li>
        </ul>
      </nav>
    </div>
    <div class="header-right">
      <input type="text" placeholder="O que você quer comer hoje?">
      <div class="icons">
        <img src="https://placehold.co/20x20" alt="search icon">
        <img src="https://placehold.co/20x20" alt="shopping cart">
        <img src="https://placehold.co/20x20" alt="user icon">
      </div>
    </div>
  </header>

  <main class="main-section">
    <div class="image-wrapper">
      <img src="https://placehold.co/500x500" alt="background of vegetables" class="background-image">
      <div class="register-box">
        <h1>Bem-vindo</h1>
        <p>Crie sua conta</p>
        <form>
          <input type="text" placeholder="Nome">
          <input type="text" placeholder="Número">
          <input type="password" placeholder="Senha">
          <input type="password" placeholder="Confirme sua senha">
          <button type="submit">Registrar</button>
        </form>
        <p class="login-text">Já tem uma conta? <a href="#">Faça login</a></p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <div class="footer-col">
        <h2>EXPLOREMOS SABORES E AROMAS</h2>
        <h1>TASTY TRAIL</h1>
        <div class="social-icons">
          <img src="https://placehold.co/30x30" alt="Facebook">
          <img src="https://placehold.co/30x30" alt="Instagram">
          <img src="https://placehold.co/30x30" alt="Twitter">
        </div>
      </div>
      <div class="footer-col">
        <h3>Information</h3>
        <ul>
          <li><a href="#">Produtos</a></li>
          <li><a href="#">Contactos</a></li>
          <li><a href="#">Sobre</a></li>
        </ul>
      </div>
      <div class="footer-col">
        <h3>Precisa de ajuda?</h3>
        <p>tastytrail@gmail.com</p>
        <p>11 98334 9999</p>
      </div>
    </div>
    <div class="footer-bottom">2024 all Right Reserved</div>
  </footer>

</body>
</html>
