<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style/style.css') }}"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;400;700;900&display=swap" rel="stylesheet">
    <title>Tasty Trail - Contatos</title>
  </head>
</head>

<body>

    <header class="header">
        <section>
            <a href="/" class="logo">
                <img
                    src="{{ url_for('static', filename='img/Logo.svg') }}"
                    alt="logo"
                    class="logotipo"
                />
            </a>

            <nav class="navbar">
                <a href="/">Home</a>
                <a href="/produtos">Produtos</a>
                <a href="/contatos">Contatos</a>
                <a href="/sobre">Sobre</a>
            </nav>

            <form class="searchbox" action="/buscar" method="get">
                <input type="search" name="q" placeholder="O que você quer comer hoje?">
                <button type="submit">
                    <img width="20" height="20"
                         src="https://img.icons8.com/forma-thin/20/search.png"
                         alt="search" />
                </button>
            </form>

        <div class="icons">
          <a href="/login">
            <img
              src="{{ url_for('static', filename='img/Person.svg') }}"
              id="person"
              alt="person"
            />
          </a>
          <a href="">
            <img
              src="{{ url_for('static', filename='img/Cart.svg') }}"
              id="cart"
              alt="Cart"
            />
          </a>
        </div>
        </section>
    </header>

    <div class="contatos-container">
        <section id="home">
            <div class="container">
                <h3>Conheça nossos endereços</h3>
                <a href="#" class="btn">Conferir agora</a>
            </div>
        </section>
    </div>

    <section class="contatos">
        <div class="contato-left">
            <h4>Nosso e-mail</h4>
            <p>tastytrail@gmail.com</p>
        </div>

        <div class="contato-right">
            <h4>Telefone</h4>
            <p>11 98334 9999</p>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-content">

            <div class="footer-left">
                <img
                    id="text-logo"
                    src="{{ url_for('static', filename='img/Group 1.svg') }}"
                    alt="text-logo"
                >
                <div class="socials">
                    <a href="#"><img src="https://img.icons8.com/ios-filled/50/ffffff/facebook.png" alt="facebook"></a>
                    <a href="#"><img src="https://img.icons8.com/ios-filled/50/ffffff/instagram-new.png" alt="instagram"></a>
                    <a href="#"><img src="https://img.icons8.com/ios-filled/50/ffffff/twitter.png" alt="twitter"></a>
                </div>
            </div>

            <div class="footer-center">
                <h3>Information</h3>
                <ul>
                    <li><a href="/produtos">Produtos</a></li>
                    <li><a href="/contatos">Contatos</a></li>
                    <li><a href="/sobre">Sobre</a></li>
                </ul>
            </div>

            <div class="footer-right">
                <h3>Precisa de ajuda?</h3>
                <p>tastytrail@gmail.com</p>
                <p>11 98334 9999</p>
            </div>

        </div>

        <div class="footer-bottom">
            <p>2025 all Right Reserved</p>
        </div>
    </footer>

</body>

</html>
