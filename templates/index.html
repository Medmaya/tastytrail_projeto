<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/style.css">
    <link rel="stylesheet" href="https://use.typekit.net/xet6ahk.css">
    <title>TASTY TRAIL</title>
</head>

<body>
    <header class="header">
        <section>
            <a href="#" class="logo">
                <img src="../img/Logo.svg" alt="logo">
            </a>

            <nav class="navbar">
                <a href="#home">Home</a>
                <a href="#products">Produtos</a>
                <a href="#contacts">Contatos</a>
                <a href="#about">Sobre</a>
            </nav>

            <form class="searchbox" action="/buscar" method="get">
                <input type="search" name="q" placeholder="O que você quer comer hoje?">
                <button type="submit">
                    <img width="20" height="20" src="https://img.icons8.com/forma-thin/20/search.png" alt="search" />
                </button>
            </form>

            <div class="icons">
                <img src="../img/Person.svg" alt="person">
                <img src="../img/Cart.svg" alt="Cart">
            </div>

            <button id="theme-toggle">
                <img width="60" height="60" src="https://img.icons8.com/ios/60/sun--v1.png" alt="sun--v1"/>
            </button>
        </section>
    </header>
</body>
/

</html>
